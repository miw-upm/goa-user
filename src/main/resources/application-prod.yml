spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}
  security:
    oauth2:
      authorizationserver:
        issuer-uri: ${HOST}/api/goa-user

app:
  oauth2:
    token-uri: ${spring.security.oauth2.authorizationserver.issuer-uri}/oauth2/token
    spa-client-id: spaClientId
    spa-login-redirect-uri: ${HOST}/callback
    spa-logout-redirect-uri: ${HOST}
    api-client-id: ${API_CLIENT_ID}
    api-client-secret: ${API_CLIENT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: http://goa-eureka:8761/eureka/

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
