server:
  port: 8081
  forward-headers-strategy: framework

info:
  app:
    artifact: "@project.artifactId@"
    version: "@project.version@"
    build: "@maven.build.timestamp@"

spring:
  application:
    name: goa-user
  profiles:
    default: dev
  output:
    ansi:
      enabled: ALWAYS
  cache:
    type: none
  jackson:
    default-property-inclusion: NON_NULL
  security:
    oauth2:
      authorizationserver:
        issuer-uri: ${BASE_URL:http://localhost:8080}/api/goa-user

app:
  hosting: localhost
  db:
    admin: ${DB_ADMIN:admin}
    mobile: ${DB_MOBILE:6}
    password: ${DB_PASSWORD:6}
  oauth2:
    token-uri: ${BASE_URL:http://localhost:8080}/api/goa-user/oauth2/token
    open-api-client-id: client-id
    open-api-client-secret: client-secret
    open-api-redirect-uris:
      - http://localhost:8081/swagger-ui/oauth2-redirect.html
    spa-client-id: spaClientId
    spa-logout-redirect-uri: http://localhost:4200
    spa-login-redirect-uri: http://localhost:4200/callback
    api-client-id: api-client-id
    api-client-secret: api-client-secret
    jwt:
      key-alias: goa-jwt
      key-id: goa-jwt-k1
      key-store-base64: ${JWT_KEYSTORE_BASE64}
      key-store-password: ${JWT_STORE_PASSWORD:dev}
      key-password: ${JWT_KEY_PASSWORD:dev}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    es.upm.api: DEBUG

eureka:
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
