spring:
  application:
    name: goa-user
  profiles:
    # Profile ----------------------------------------
    active: dev
  # ------------------------------------------------
  output:
    ansi:
      enabled: ALWAYS
  cache:
    type: none
  jackson:
    default-property-inclusion: NON_NULL
  security:
    oauth2:
      issuer-uri: http://localhost:8080/api/goa-user
      token-uri: http://localhost:8080/api/goa-user/oauth2/token
      open-api-client-id: client-id
      open-api-client-secret: client-secret
      open-api-redirect-uris:
        - http://localhost:8081/swagger-ui/oauth2-redirect.html
      spa-client-id: spaClientId
      spa-logout-redirect-uri: http://localhost:4200
      spa-login-redirect-uri: http://localhost:4200/callback
      api-client-id: api-client-id
      api-client-secret: api-client-secret


server:
  port: 8081
  forward-headers-strategy: framework

info:
  app:
    artifact: "@project.artifactId@"
    version: "@project.version@"
    build: "@maven.build.timestamp@"
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    es.upm: DEBUG
    org.springframework.security: WARN

eureka:
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

miw:
  admin: admin
  mobile: 6
  password: 6
