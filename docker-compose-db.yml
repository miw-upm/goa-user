services:

  mongo:
    image: mongodb/mongodb-community-server:7.0.16-ubuntu2204
    container_name: mongo-server
    restart: always
    environment:
      MONGODB_INITDB_ROOT_USERNAME: mongo
      MONGODB_INITDB_ROOT_PASSWORD: mongo
      MONGODB_INITDB_DATABASE: goauserdb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - goa

volumes:
  mongo_data:
    name: "mongo-data"
  mongo_config:
    name: "mongo-config"

networks:
  goa:
    external: true

